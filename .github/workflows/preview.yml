# Online preview of v2: builds the site under /website-preview/ (noindex) and
# pushes it to the gh-pages branch of alishdipani/website-preview, which serves
# it at https://alishdipani.github.io/website-preview/. Runs on every push to v2.
#
# One-time setup (needs Alish's OK): create the public repo alishdipani/website-preview,
# add a deploy key with write access to it, put the private key in this repo's secret
# PREVIEW_DEPLOY_KEY, and set website-preview's Pages source to its gh-pages branch.
# Until the secret exists, the deploy step is skipped and the job only builds.
name: Preview v2

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:preview
      - run: node scripts/check-links.mjs dist-preview /website-preview
      - if: env.HAS_DEPLOY_KEY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          external_repository: alishdipani/website-preview
          publish_branch: gh-pages
          publish_dir: dist-preview
          force_orphan: true
          commit_message: Preview of alishdipani.github.io v2
